<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoneCrew - Xbox 360 Vault</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #070c14;
            color: #e0e0e0;
            margin: 0;
            padding: 30px 0 50px 0;
        }

        .banner-header {
            width: 100%;
            max-width: 950px;
            margin: 0 auto 25px auto;
            text-align: center;
        }

        .banner-header img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #0b1320;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1a273b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 {
            color: #ff9900;
            text-align: center;
            margin-top: 0;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 153, 0, 0.4);
            border-bottom: 2px solid #1a273b;
            padding-bottom: 15px;
        }

        p.subtitle {
            color: #6882a0;
            text-align: center;
            font-size: 0.95em;
            margin-bottom: 25px;
        }

        /* Such- & Filterbereich */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            background-color: #101c2e;
            border: 1px solid #1a273b;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95em;
            outline: none;
        }

        select {
            flex: 1;
            min-width: 200px;
            cursor: pointer;
        }

        input[type="text"] {
            flex: 2;
            min-width: 250px;
        }

        input[type="text"]:focus, select:focus {
            border-color: #ff9900;
        }

        .file-count {
            color: #00ff66;
            font-size: 0.85em;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Spiele-Liste */
        ul.file-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-height: 600px;
            overflow-y: auto;
        }

        ul.file-list li {
            padding: 12px 16px;
            border-bottom: 1px solid #142033;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease-in-out;
            border-radius: 6px;
        }

        ul.file-list li:hover {
            background-color: #101c2e;
            border-left: 4px solid #00ff66;
            padding-left: 12px;
        }

        .game-title {
            font-weight: 500;
            color: #d1dfef;
            font-size: 0.9em;
            word-break: break-word;
            padding-right: 15px;
        }

        a.dl-btn {
            background: linear-gradient(135deg, #ff9900 0%, #cc5500 100%);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
            white-space: nowrap;
            transition: all 0.2s ease-in-out;
        }

        a.dl-btn:hover {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.7);
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #ff9900;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85em;
            color: #4b617a;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="banner-header">
    <img src="Unbenannt.png" alt="BoneCrew Banner">
</div>

<div class="container">
    <h1>Microsoft Xbox 360 Vault</h1>
    <p class="subtitle">Durchsuche alle direkten Spiel-Downloads live auf Archive.org</p>
    
    <div class="controls">
        <select id="repoSelect" onchange="loadCategoryFiles()">
            <option value="microsoft_xbox360_a_part1">Buchstabe A (Part 1)</option>
            <option value="microsoft_xbox360_a_part2">Buchstabe A (Part 2)</option>
            <option value="microsoft_xbox360_b_part1">Buchstabe B (Part 1)</option>
            <option value="microsoft_xbox360_b_part2">Buchstabe B (Part 2)</option>
            <option value="microsoft_xbox360_c_part1">Buchstabe C (Part 1)</option>
            <option value="microsoft_xbox360_c_part2">Buchstabe C (Part 2)</option>
            <option value="microsoft_xbox360_d_part1">Buchstabe D (Part 1)</option>
            <option value="microsoft_xbox360_d_part2">Buchstabe D (Part 2)</option>
            <option value="microsoft_xbox360_e">Buchstabe E</option>
            <option value="microsoft_xbox360_f_part1">Buchstabe F (Part 1)</option>
            <option value="microsoft_xbox360_g">Buchstabe G</option>
            <option value="microsoft_xbox360_h">Buchstabe H</option>
            <option value="microsoft_xbox360_i">Buchstabe I</option>
            <option value="microsoft_xbox360_j">Buchstabe J</option>
            <option value="microsoft_xbox360_k">Buchstabe K</option>
            <option value="microsoft_xbox360_l">Buchstabe L</option>
            <option value="microsoft_xbox360_m_part1">Buchstabe M (Part 1)</option>
            <option value="microsoft_xbox360_n_part1">Buchstabe N (Part 1)</option>
            <option value="microsoft_xbox360_o">Buchstabe O</option>
            <option value="microsoft_xbox360_p">Buchstabe P</option>
            <option value="microsoft_xbox360_q">Buchstabe Q</option>
            <option value="microsoft_xbox360_r">Buchstabe R</option>
            <option value="microsoft_xbox360_s_part1">Buchstabe S (Part 1)</option>
            <option value="microsoft_xbox360_t_part1">Buchstabe T (Part 1)</option>
            <option value="microsoft_xbox360_u">Buchstabe U</option>
            <option value="microsoft_xbox360_v">Buchstabe V</option>
            <option value="microsoft_xbox360_w">Buchstabe W</option>
            <option value="microsoft_xbox360_x_part1">Buchstabe X (Part 1)</option>
            <option value="microsoft_xbox360_y">Buchstabe Y</option>
            <option value="microsoft_xbox360_z">Buchstabe Z</option>
            <option value="microsoft_xbox360_digital_part1">Digital Games (Part 1)</option>
            <option value="microsoft_xbox360_titleupdates">Title Updates</option>
        </select>

        <input type="text" id="searchInput" placeholder="Spiel suchen..." onkeyup="filterFiles()">
    </div>

    <div id="fileCount" class="file-count"></div>
    <div id="loadingStatus" class="loading" style="display:none;">Lade Spieledateien von Archive.org...</div>

    <ul id="fileList" class="file-list"></ul>

    <div class="footer">
        Powered by BoneCrew Vault &amp; Archive.org
    </div>
</div>

<script>
    let currentFiles = [];

    async function loadCategoryFiles() {
        const repo = document.getElementById('repoSelect').value;
        const listContainer = document.getElementById('fileList');
        const status = document.getElementById('loadingStatus');
        const countDisplay = document.getElementById('fileCount');

        listContainer.innerHTML = '';
        status.style.display = 'block';
        countDisplay.innerText = '';

        try {
            // Abfrage der Dateiliste über die offizielle Archive.org Metadata-API
            const response = await fetch(`https://archive.org/metadata/${repo}/files`);
            const data = await response.json();

            // Nur ZIP/ISO Spieledateien filtern
            currentFiles = data.result.filter(file => file.name.endsWith('.zip') || file.name.endsWith('.iso'));

            status.style.display = 'none';
            renderFiles(currentFiles, repo);
        } catch (error) {
            status.style.display = 'block';
            status.innerText = 'Fehler beim Laden der Dateiliste von Archive.org!';
        }
    }

    function renderFiles(files, repo) {
        const listContainer = document.getElementById('fileList');
        const countDisplay = document.getElementById('fileCount');
        listContainer.innerHTML = '';

        countDisplay.innerText = `${files.length} Spiele gefunden`;

        files.forEach(file => {
            const li = document.createElement('li');
            
            // Direkt-URL zum Download der einzelnen Spieledatei aufbauen
            const directUrl = `https://archive.org/download/${repo}/${encodeURIComponent(file.name)}`;

            li.innerHTML = `
                <span class="game-title">${file.name}</span>
                <a class="dl-btn" href="${directUrl}" target="_blank">Download</a>
            `;
            listContainer.appendChild(li);
        });
    }

    function filterFiles() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const repo = document.getElementById('repoSelect').value;
        const filtered = currentFiles.filter(f => f.name.toLowerCase().includes(query));
        renderFiles(filtered, repo);
    }

    // Beim Laden der Seite automatisch den ersten Buchstaben aufrufen
    loadCategoryFiles();
</script>

</body>
</html>
