<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoneCrew - Vault</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #070c14;
            color: #e0e0e0;
            margin: 0;
            padding: 30px 0 50px 0;
        }

        .banner-header {
            width: 100%;
            max-width: 950px;
            margin: 0 auto 20px auto;
            text-align: center;
        }

        .banner-header img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        /* Konsolen-Navigation / Tabs */
        .console-nav {
            max-width: 950px;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: #0b1320;
            border: 1px solid #1a273b;
            color: #8fa3be;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .nav-btn:hover {
            border-color: #ff9900;
            color: #ffffff;
            background-color: #101c2e;
        }

        /* Aktiver Reiter */
        .nav-btn.active {
            background: linear-gradient(135deg, #ff9900 0%, #cc5500 100%);
            color: #ffffff;
            border-color: #ff9900;
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.4);
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #0b1320;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1a273b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 {
            color: #ff9900;
            text-align: center;
            margin-top: 0;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 153, 0, 0.4);
            border-bottom: 2px solid #1a273b;
            padding-bottom: 15px;
        }

        p.subtitle {
            color: #6882a0;
            text-align: center;
            font-size: 0.95em;
            margin-bottom: 25px;
        }

        /* Liste */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 14px 16px;
            border-bottom: 1px solid #142033;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease-in-out;
            border-radius: 6px;
        }

        li:hover {
            background-color: #101c2e;
            border-left: 4px solid #00ff66;
            padding-left: 12px;
        }

        .title {
            font-weight: 600;
            color: #d1dfef;
            font-size: 0.95em;
        }

        /* Buttons im feurigen Orange mit Neongrün-Hover */
        a.dl-btn {
            background: linear-gradient(135deg, #ff9900 0%, #cc5500 100%);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }

        a.dl-btn:hover {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.7);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85em;
            color: #4b617a;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="banner-header">
    <img src="Unbenannt.png" alt="BoneCrew Banner">
</div>

<!-- Konsolen-Navigation / Dynamische Tabs -->
<div class="console-nav">
    <button class="nav-btn active" onclick="switchConsole('xbox360', this)">Xbox 360</button>
    <button class="nav-btn" onclick="switchConsole('xboxClassic', this)">Xbox Classic</button>
    <button class="nav-btn" onclick="switchConsole('nintendoWii', this)">Nintendo Wii</button>
</div>

    function switchConsole(key, element) {
        const consoleData = vaultData[key];
        if (!consoleData) return;

        // Titel ändern
        document.getElementById('vaultTitle').innerText = consoleData.title;

        // Liste neu aufbauen
        const listContainer = document.getElementById('vaultList');
        listContainer.innerHTML = '';

        consoleData.items.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="title">${item.name}</span> <a class="dl-btn" href="${item.link}" target="_blank">Download</a>`;
            listContainer.appendChild(li);
        });

        // Aktiven Button optisch anpassen
        if (element) {
            const buttons = document.querySelectorAll('.console-nav .nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    }

    // Beim Laden der Seite direkt Xbox 360 anzeigen
    document.addEventListener("DOMContentLoaded", () => {
        const firstBtn = document.querySelector('.console-nav .nav-btn');
        switchConsole('xbox360', firstBtn);
    });
